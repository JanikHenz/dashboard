<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="css/style.css" rel="stylesheet">
  <link href="css/monitoring.css" rel="stylesheet">
  <link href="css/timer.css" rel="stylesheet">
  <link href="css/mode.css" rel="stylesheet">
  <link href="css/power.css" rel="stylesheet">
  <link href="css/apps.css" rel="stylesheet">
  <script src="js/script.js"></script>
</head>

<body>

  <div class="content">

    <header>
      <div class="shadow">
        <div class="border">
          <div class="header">
            <div class="header-left">
              <div class="timer">
                <div class="segment">
                  <!-- DAYS -->
                  <div class="group">
                    <div class="digits">
                      <div class="digit" id="d0"></div>
                      <div class="digit" id="d1"></div>
                    </div>
                  </div>
                  <div class="separator">:</div>
                  <!-- HOURS -->
                  <div class="group">
                    <div class="digits">
                      <div class="digit" id="h0"></div>
                      <div class="digit" id="h1"></div>
                    </div>
                  </div>
                  <div class="separator">:</div>
                  <!-- MINUTES -->
                  <div class="group">
                    <div class="digits">
                      <div class="digit" id="m0"></div>
                      <div class="digit" id="m1"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="header-center">
              <div class="power">
                <button class="power-btn">
                  <div class="power-icon"></div>
                </button>
              </div>
            </div>
            <div class="header-right">
              <div class="pwr-status">
                <span class="pwr-label">Power</span>
                <div class="pwr-led"></div>
              </div>
              <div class="mode" id="theme-toggle">
                <div class="sign">
                  <div class="icon-sun">☀️</div>
                  <div class="icon-moon">🌙</div>
                  <div class="drehteil">
                    <div class="spitze">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="apps">
        <div class="apps-inner">
          <div id="app-grid" class="apps-container">
          </div>
        </div>
      </div>

      <button class="hint">
        <h2>BORING STUFF</h2>
        <div class="arrow"></div>
      </button>
    </main>
  </div>

  <div class="content">
    <header id="monitoring-header">
    </header>
    <main>
      <div class="apps" id="charts">
        <div class="chart">

        </div>

        <div class="chart">

        </div>

        <div class="chart">

        </div>

        <div class="chart">

        </div>
      </div>
      <button class="hint" id="hidden">
        <h2>BORING STUFF</h2>
        <div class="arrow"></div>
      </button>
    </main>
  </div>
</body>

</html>
