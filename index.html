<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="css/style.css" rel="stylesheet">
  <link href="css/monitoring.css" rel="stylesheet">
  <link href="css/timer.css" rel="stylesheet">
  <link href="css/mode.css" rel="stylesheet">
  <script src="js/script.js"></script>
</head>

<body>
  <div class="content">

    <header>
      <div class="shadow">
        <div class="border">
          <div class="header">
            <div class="timer">
              <div class="segment">
                <!-- DAYS -->
                <div class="group">
                  <div class="digits">
                    <div class="digit" id="d0"></div>
                    <div class="digit" id="d1"></div>
                  </div>
                </div>
                <div class="separator">:</div>
                <!-- HOURS -->
                <div class="group">
                  <div class="digits">
                    <div class="digit" id="h0"></div>
                    <div class="digit" id="h1"></div>
                  </div>
                </div>
                <div class="separator">:</div>
                <!-- MINUTES -->
                <div class="group">
                  <div class="digits">
                    <div class="digit" id="m0"></div>
                    <div class="digit" id="m1"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="power">
              <button class="power-btn">
                <div class="power-icon"></div>
              </button>
            </div>
            <div class="mode" id="theme-toggle">
              <div class="sign">
                <div class="icon-sun">☀️</div>
                <div class="icon-moon">🌙</div>
                <div class="drehteil">
                  <div class="spitze">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="apps">
        <div class="apps-inner">

          <div class="app">
            <div class="threed">
              <div class="icon"></div>
            </div>
            <div class="appinfo">
              <div class="status"></div>
              <h1>Jellyfin</h1>
            </div>
          </div>

          <div class="app">
            <div class="threed">
              <div class="icon"></div>
            </div>
            <div class="appinfo">
              <div class="status"></div>
              <h1>Jellyfin</h1>
            </div>
          </div>

          <div class="app">
            <div class="threed">
              <div class="icon"></div>
            </div>
            <div class="appinfo">
              <div class="status"></div>
              <h1>Jellyfin</h1>
            </div>
          </div>

          <div class="app">
            <div class="threed">
              <div class="icon"></div>
            </div>
            <div class="appinfo">
              <div class="status"></div>
              <h1>Jellyfin</h1>
            </div>
          </div>

          <div class="app">
            <div class="threed">
              <div class="icon"></div>
            </div>
            <div class="appinfo">
              <div class="status"></div>
              <h1>Jellyfin</h1>
            </div>
          </div>

        </div>
      </div>

      <button class="hint">
        <h2>BORING STUFF</h2>
        <div class="arrow"></div>
      </button>
    </main>
  </div>
  <div class="content">
    <header id="monitoring-header">
    </header>
    <main>
      <div class="apps" id="charts">
        <div class="chart">

        </div>

        <div class="chart">

        </div>

        <div class="chart">

        </div>

        <div class="chart">

        </div>
      </div>
      <button class="hint" id="hidden">
        <h2>BORING STUFF</h2>
        <div class="arrow"></div>
      </button>
    </main>
  </div>
</body>
</html>
