<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="css/style.css" rel="stylesheet">
  <link href="css/monitoring.css" rel="stylesheet">
  <link href="css/timer.css" rel="stylesheet">
  <link href="css/mode.css" rel="stylesheet">
  <link href="css/power.css" rel="stylesheet">
  <link href="css/apps.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script type="module" src="js/script.js"></script>
</head>

<body>

<div class="shell" id="app-shell">
  <div class="content">

    <header>
      <div class="shadow">
        <div class="border">
          <div class="header">
            <div class="header-left">
              <div class="timer">
                <div class="segment">
                  <!-- DAYS -->
                  <div class="group">
                    <div class="digits">
                      <div class="digit" id="d0">
                        <div class="seg seg-a"></div>
                        <div class="seg seg-b"></div>
                        <div class="seg seg-c"></div>
                        <div class="seg seg-d"></div>
                        <div class="seg seg-e"></div>
                        <div class="seg seg-f"></div>
                        <div class="seg seg-g"></div>
                      </div>
                      <div class="digit" id="d1">
                        <div class="seg seg-a"></div>
                        <div class="seg seg-b"></div>
                        <div class="seg seg-c"></div>
                        <div class="seg seg-d"></div>
                        <div class="seg seg-e"></div>
                        <div class="seg seg-f"></div>
                        <div class="seg seg-g"></div>
                      </div>
                    </div>
                  </div>
                  <div class="separator">:</div>
                  <!-- HOURS -->
                  <div class="group">
                    <div class="digits">
                      <div class="digit" id="h0">
                        <div class="seg seg-a"></div>
                        <div class="seg seg-b"></div>
                        <div class="seg seg-c"></div>
                        <div class="seg seg-d"></div>
                        <div class="seg seg-e"></div>
                        <div class="seg seg-f"></div>
                        <div class="seg seg-g"></div>
                      </div>
                      <div class="digit" id="h1">
                        <div class="seg seg-a"></div>
                        <div class="seg seg-b"></div>
                        <div class="seg seg-c"></div>
                        <div class="seg seg-d"></div>
                        <div class="seg seg-e"></div>
                        <div class="seg seg-f"></div>
                        <div class="seg seg-g"></div>
                      </div>
                    </div>
                  </div>
                  <div class="separator">:</div>
                  <!-- MINUTES -->
                  <div class="group">
                    <div class="digits">
                      <div class="digit" id="m0">
                        <div class="seg seg-a"></div>
                        <div class="seg seg-b"></div>
                        <div class="seg seg-c"></div>
                        <div class="seg seg-d"></div>
                        <div class="seg seg-e"></div>
                        <div class="seg seg-f"></div>
                        <div class="seg seg-g"></div>
                      </div>
                      <div class="digit" id="m1">
                        <div class="seg seg-a"></div>
                        <div class="seg seg-b"></div>
                        <div class="seg seg-c"></div>
                        <div class="seg seg-d"></div>
                        <div class="seg seg-e"></div>
                        <div class="seg seg-f"></div>
                        <div class="seg seg-g"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="header-center">
              <div class="power">
                <button class="power-btn">
                  <div class="power-icon"></div>
                </button>
              </div>
            </div>
            <div class="header-right">
              <div class="pwr-status">
                <span class="pwr-label">Power</span>
                <div class="pwr-led"></div>
              </div>
              <div class="mode" id="theme-toggle">
                <div class="sign">
                  <div class="icon-sun">☀️</div>
                  <div class="icon-moon">🌙</div>
                  <div class="drehteil">
                    <div class="spitze">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="apps-layout">
        <div class="apps">
          <div class="apps-inner" id="app-grid">
          </div>
        </div>

        <!-- Global Replica Control -->
        <div class="replica-control" id="replica-control">
          <h2>Replica <br> Control</h2>
          <div class="app-name" id="selected-app-name">Keine App <br> ausgewählt</div>
          <div class="replica-info">
            <span class="replica-count" id="replica-count">-/-</span>
            <span class="replica-label">Pods</span>
          </div>
          <div class="replica-slider">
            <input 
              type="range" 
              min="0" 
              max="5" 
              value="1" 
              id="global-slider"
              class="slider"
              disabled
            >
            <span class="slider-value" id="slider-value">-</span>
          </div>
        </div>
      </div>

      <button class="hint">
        <h2>BORING STUFF</h2>
        <div class="arrow"></div>
      </button>
    </main>
  </div>

  <div class="content">
    <header id="monitoring-header">
      <div class="monitoring-panel">
        <div class="monitoring-stats">
          <div class="monitor-stat" id="monitor-stat-cpu">
            <span class="monitor-stat-label">CPU</span>
            <strong class="monitor-stat-value" id="monitor-stat-cpu-value">--</strong>
          </div>
          <div class="monitor-stat" id="monitor-stat-memory">
            <span class="monitor-stat-label">RAM</span>
            <strong class="monitor-stat-value" id="monitor-stat-memory-value">--</strong>
          </div>
          <div class="monitor-stat" id="monitor-stat-gpu">
            <span class="monitor-stat-label">GPU</span>
            <strong class="monitor-stat-value" id="monitor-stat-gpu-value">--</strong>
          </div>
          <div class="monitor-stat" id="monitor-stat-gpuTemp">
            <span class="monitor-stat-label">GPU TEMP</span>
            <strong class="monitor-stat-value" id="monitor-stat-gpuTemp-value">--</strong>
          </div>
          <div class="monitor-stat" id="monitor-stat-powerW">
            <span class="monitor-stat-label">POWER</span>
            <strong class="monitor-stat-value" id="monitor-stat-powerW-value">--</strong>
          </div>
          <div class="monitor-stat" id="monitor-stat-networkRx">
            <span class="monitor-stat-label">NETZ</span>
            <strong class="monitor-stat-value" id="monitor-stat-networkRx-value">--</strong>
          </div>
          <div class="monitor-stat" id="monitor-stat-diskFree">
            <span class="monitor-stat-label">DISK FREI</span>
            <strong class="monitor-stat-value" id="monitor-stat-diskFree-value">--</strong>
          </div>
          <div class="monitor-stat" id="monitor-stat-nodesUp">
            <span class="monitor-stat-label">NODES</span>
            <strong class="monitor-stat-value" id="monitor-stat-nodesUp-value">--</strong>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="apps" id="charts">
        <div class="chart" id="chart-cpu"></div>
        <div class="chart" id="chart-memory"></div>
        <div class="chart" id="chart-network"></div>
        <div class="chart" id="chart-disk"></div>
      </div>
      <button class="hint back-hint">
        <div class="arrow arrow-up"></div>
        <h2>BACK TO APPS</h2>
      </button>
    </main>
  </div>
</div>
</body>

</html>
